# ============================================================
# GitHub Actions — Full CI/CD Pipeline
# Builds Docker image → Pushes to ECR → Deploys via Terraform
# AWS Academy Compatible (uses session token)
# ============================================================

name: Deploy to AWS ECS

on:
  push:
    branches:
      - main   # Triggers on every push to main branch

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.14.8
  TF_IN_AUTOMATION: true
  TF_VAR_subnet_ids: '["${{ secrets.AWS_SUBNET_ID }}"]'
  TF_VAR_security_group_id: ${{ secrets.AWS_SECURITY_GROUP_ID }}

jobs:
  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          echo "✅ Terraform formatting is valid"

      - name: Terraform Init (backend=false)
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform validate
          echo "✅ Terraform configuration is valid"

      - name: Install hadolint
        run: |
          curl -sSL https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint

      - name: Run hadolint
        run: |
          hadolint Docker/Dockerfile.backend Docker/Dockerfile.frontend
          echo "✅ Dockerfiles pass linting"

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: lint

    steps:
      # ── Step 1: Checkout code ──────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── Step 2: Configure AWS credentials (Academy = 3 keys) ──
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── Step 3: Validate required deployment secrets ─────────
      - name: Validate Required Secrets
        run: |
          test -n "${{ secrets.AWS_SUBNET_ID }}" || (echo "❌ Missing secret: AWS_SUBNET_ID" && exit 1)
          test -n "${{ secrets.AWS_SECURITY_GROUP_ID }}" || (echo "❌ Missing secret: AWS_SECURITY_GROUP_ID" && exit 1)
          echo "✅ All required secrets are present"

      # ── Step 4: Login to Amazon ECR ───────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── Step 5: Build, Tag & Push Backend Docker Image ─────────────
      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_BACKEND_REPO: shopsmart-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Ensure ECR repository exists
          aws ecr describe-repositories --repository-names "$ECR_BACKEND_REPO" --region "$AWS_REGION" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$ECR_BACKEND_REPO" --region "$AWS_REGION"
          
          # Build and push
          IMAGE_URI=$ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG
          LATEST_URI=$ECR_REGISTRY/$ECR_BACKEND_REPO:latest
          
          echo "Building backend Docker image..."
          docker build -f Docker/Dockerfile.backend -t $IMAGE_URI -t $LATEST_URI .
          
          echo "Pushing backend image to ECR..."
          docker push $IMAGE_URI
          docker push $LATEST_URI
          
          echo "✅ Backend Docker image pushed: $IMAGE_URI"

      # ── Step 6: Build, Tag & Push Frontend Docker Image ─────────────
      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_FRONTEND_REPO: shopsmart-frontend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Ensure ECR repository exists
          aws ecr describe-repositories --repository-names "$ECR_FRONTEND_REPO" --region "$AWS_REGION" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$ECR_FRONTEND_REPO" --region "$AWS_REGION"
          
          # Build and push
          IMAGE_URI=$ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG
          LATEST_URI=$ECR_REGISTRY/$ECR_FRONTEND_REPO:latest
          
          echo "Building frontend Docker image..."
          docker build -f Docker/Dockerfile.frontend -t $IMAGE_URI -t $LATEST_URI .
          
          echo "Pushing frontend image to ECR..."
          docker push $IMAGE_URI
          docker push $LATEST_URI
          
          echo "✅ Frontend Docker image pushed: $IMAGE_URI"

      # ── Step 7: Setup Terraform ───────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── Step 8: Terraform Version Check ──────────────────
      - name: Terraform Version Check
        run: terraform version

      # ── Step 9: Terraform Init ───────────────────────────
      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -upgrade -input=false || (rm -rf .terraform .terraform.lock.hcl && terraform init -upgrade -input=false)
          echo "✅ Terraform initialized"

      # ── Step 10: Terraform Import Existing ECR ────────────
      - name: Terraform Import Existing ECR Repositories
        working-directory: terraform
        run: |
          terraform import -input=false aws_ecr_repository.backend "shopsmart-backend" || true
          terraform import -input=false aws_ecr_repository.frontend "shopsmart-frontend" || true
          echo "✅ Existing ECR repositories imported if present"

      # ── Step 11: Terraform Plan ───────────────────────────
      - name: Terraform Plan
        working-directory: terraform
        env:
          TF_VAR_image_tag: ${{ github.sha }}
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
        run: |
          terraform plan -input=false -out=tfplan
          echo "✅ Terraform plan complete"

      # ── Step 12: Terraform Apply ──────────────────────────
      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -input=false -auto-approve tfplan
          echo "✅ Infrastructure provisioned successfully"

      # ── Step 13: Force new ECS deployments ─────────────────
      - name: Force new deployment for backend service
        if: success()
        run: |
          aws ecs update-service \
            --cluster shopsmart-cluster \
            --service shopsmart-backend-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          echo "✅ Backend service deployment triggered"

      - name: Force new deployment for frontend service
        if: success()
        run: |
          aws ecs update-service \
            --cluster shopsmart-cluster \
            --service shopsmart-frontend-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          echo "✅ Frontend service deployment triggered"

      # ── Step 14: Print Deployment Summary ─────────────────
      - name: Deployment Summary
        if: success()
        run: |
          echo "============================================"
          echo "  ✅ DEPLOYMENT COMPLETE"
          echo "============================================"
          echo "  Region    : ${{ env.AWS_REGION }}"
          echo "  Commit    : ${{ github.sha }}"
          echo "  Backend   : shopsmart-backend:${{ github.sha }}"
          echo "  Frontend  : shopsmart-frontend:${{ github.sha }}"
          echo "============================================"
          echo ""
          echo "👉 Go to AWS Console → ECS → Clusters"
          echo "   → shopsmart-cluster → Tasks"
          echo "   → Copy Public IP → Open in browser"
